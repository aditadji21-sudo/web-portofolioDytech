<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
  <!--
    Placeholder hero banner untuk halaman Beranda.
    Ganti file ini dengan foto produk/promo asli (JPG/PNG/SVG) — ukuran
    disarankan sekitar rasio 1400x560, lalu update import di
    features/home/Hero.tsx bila nama file berbeda.
  -->
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1E" />
      <stop offset="55%" stop-color="#0E1530" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>
    <linearGradient id="heroRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C623" />
      <stop offset="55%" stop-color="#2F5CF0" />
      <stop offset="100%" stop-color="#F0323B" />
    </linearGradient>
    <linearGradient id="towerFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2340" />
      <stop offset="100%" stop-color="#0E1226" />
    </linearGradient>
    <radialGradient id="gpuGlow" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#5C82FF" />
      <stop offset="100%" stop-color="#1B3AC4" />
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#heroBg)" />

  <!-- ambient glows -->
  <circle cx="1060" cy="150" r="180" fill="#2F5CF0" opacity="0.18" filter="url(#soft)" />
  <circle cx="1230" cy="420" r="160" fill="#F6C623" opacity="0.12" filter="url(#soft)" />

  <!-- faint circuit grid -->
  <g opacity="0.12" stroke="#8AA3FF" stroke-width="1">
    <path d="M760 0 V560 M900 0 V560 M1040 0 V560 M1180 0 V560 M1320 0 V560" />
    <path d="M760 90 H1400 M760 230 H1400 M760 370 H1400 M760 470 H1400" />
  </g>

  <!-- orbit ring motif -->
  <circle cx="1130" cy="270" r="210" fill="none" stroke="url(#heroRing)" stroke-width="2" stroke-dasharray="2 10" opacity="0.5" />

  <!-- PC tower silhouette -->
  <g transform="translate(950,130)">
    <rect x="0" y="0" width="150" height="320" rx="14" fill="url(#towerFace)" stroke="#2A3358" stroke-width="2" />
    <rect x="18" y="24" width="114" height="150" rx="8" fill="#080B16" />
    <circle cx="75" cy="99" r="42" fill="url(#gpuGlow)" opacity="0.9" />
    <circle cx="75" cy="99" r="42" fill="none" stroke="#8AA3FF" stroke-width="1.5" opacity="0.6" />
    <rect x="18" y="192" width="114" height="10" rx="5" fill="#F6C623" opacity="0.85" />
    <rect x="18" y="212" width="80" height="6" rx="3" fill="#3A4470" />
    <rect x="18" y="228" width="80" height="6" rx="3" fill="#3A4470" />
    <rect x="18" y="244" width="55" height="6" rx="3" fill="#3A4470" />
    <circle cx="120" cy="285" r="7" fill="#F0323B" />
  </g>

  <!-- GPU card floating -->
  <g transform="translate(1155,300) rotate(-6)">
    <rect x="0" y="0" width="200" height="66" rx="10" fill="url(#towerFace)" stroke="#2A3358" stroke-width="2" />
    <circle cx="42" cy="33" r="24" fill="#080B16" stroke="#3A4470" stroke-width="2" />
    <circle cx="110" cy="33" r="24" fill="#080B16" stroke="#3A4470" stroke-width="2" />
    <rect x="0" y="-10" width="60" height="10" rx="3" fill="url(#heroRing)" />
  </g>

  <!-- keyboard sliver -->
  <g transform="translate(980,470)" opacity="0.9">
    <rect x="0" y="0" width="260" height="46" rx="8" fill="url(#towerFace)" stroke="#2A3358" stroke-width="2" />
    <g fill="#3A4470">
      <rect x="12" y="10" width="18" height="10" rx="2" />
      <rect x="36" y="10" width="18" height="10" rx="2" />
      <rect x="60" y="10" width="18" height="10" rx="2" />
      <rect x="84" y="10" width="18" height="10" rx="2" />
      <rect x="108" y="10" width="18" height="10" rx="2" />
      <rect x="132" y="10" width="18" height="10" rx="2" />
      <rect x="156" y="10" width="18" height="10" rx="2" />
      <rect x="180" y="10" width="18" height="10" rx="2" />
      <rect x="204" y="10" width="18" height="10" rx="2" />
      <rect x="12" y="26" width="90" height="10" rx="2" fill="#F6C623" opacity="0.6" />
    </g>
  </g>
</svg>
